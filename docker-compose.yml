services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: image-analyzer-backend
    env_file:
      - ./backend/.env
    ports:
      - "3050:3050"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: image-analyzer-frontend
    env_file:
      - ./frontend/.env.local
    environment:
      - BACKEND_URL=http://backend:3050
    ports:
      - "3001:3000"
    restart: unless-stopped
